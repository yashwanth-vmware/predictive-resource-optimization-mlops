name: Predictive Resource Optimization MLOps Pipeline

on:
  push:
    branches: ["dev", "main"]
  workflow_dispatch:

concurrency:
  group: predictive-resource-optimization-mlops-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"

jobs:
  data_prep:
    name: Data Prep (HF Dataset Hub)
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO_ID: ${{ vars.HF_DATASET_REPO_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install pandas huggingface_hub
      - name: Validate required env vars
        run: |
          python - <<'PY'
          import os, sys
          missing = [k for k in ["HF_TOKEN", "HF_DATASET_REPO_ID"] if not (os.getenv(k) or "").strip()]
          if missing:
              print("Missing env vars:", missing)
              sys.exit(1)
          print("Env vars present.")
          PY
      - name: Run data preparation (chronological split + upload)
        run: python predictive_resource_optimization/model_building/prep.py

  train:
    name: Train + Track + Upload Model (HF Model Hub)
    needs: data_prep
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO_ID: ${{ vars.HF_DATASET_REPO_ID }}
      HF_MODEL_REPO_ID: ${{ vars.HF_MODEL_REPO_ID }}
      MLFLOW_EXPERIMENT: Predictive_Resource_Optimization
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install pandas scikit-learn huggingface_hub mlflow joblib numpy
      - name: Validate required env vars
        run: |
          python - <<'PY'
          import os, sys
          required = ["HF_TOKEN", "HF_DATASET_REPO_ID", "HF_MODEL_REPO_ID"]
          missing = [k for k in required if not (os.getenv(k) or "").strip()]
          if missing:
              print("Missing env vars:", missing)
              sys.exit(1)
          print("Env vars present.")
          PY
      - name: Train all 6 Random Forest models + log MLflow + upload to Model Hub
        run: python predictive_resource_optimization/model_building/train.py

  deploy:
    name: Deploy validated Gradio app to Hugging Face Space
    needs: train
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_GRADIO_SPACE_ID: ${{ vars.HF_GRADIO_SPACE_ID || 'Yash0204/infra-predictive-optimization-mlops-gradio' }}
      HF_MODEL_REPO_ID: ${{ vars.HF_MODEL_REPO_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install deployment dependency
        run: |
          python -m pip install -U pip
          pip install huggingface_hub
      - name: Validate deploy configuration and app files
        run: |
          python - <<'PY'
          import os, sys
          missing = [k for k in ["HF_TOKEN", "HF_GRADIO_SPACE_ID", "HF_MODEL_REPO_ID"] if not (os.getenv(k) or "").strip()]
          if missing:
              print("Missing env vars:", missing)
              sys.exit(1)
          print("Deployment configuration present.")
          PY
          python -m py_compile predictive_resource_optimization/deployment_gradio/app.py
          test -f predictive_resource_optimization/deployment_gradio/README.md
          test -f predictive_resource_optimization/deployment_gradio/requirements.txt
      - name: Deploy Gradio app to existing Hugging Face Space
        run: python predictive_resource_optimization/deploy_to_gradio_space.py
